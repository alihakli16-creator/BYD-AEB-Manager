name: AFS Kapat - Android 10 APK Derleme

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak Kodları Çek (Checkout)
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle Wrapper İzinlerini Ayarla
        run: chmod +x gradlew

      - name: Gradle ile APK Derle
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: APK Dosyasını Hazırla
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} output_apk/AFS_Kapat_v2.0_Android10.apk \;
          ls -la output_apk/

      - name: APK'yı GitHub Artifacts Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: AFS_Kapat_v2.0_Android10_DiLink3
          path: output_apk/AFS_Kapat_v2.0_Android10.apk
          retention-days: 30
