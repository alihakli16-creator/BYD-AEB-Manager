plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '1.9.22'
}

android {
    namespace 'com.byd.aebtoggle'
    compileSdk 34

    defaultConfig {
        applicationId "com.mk.aebmanager"
        minSdk 29
        targetSdk 29
        versionCode 20
        versionName "2.0-dilink3"

        buildConfigField "String", "APP_DISPLAY_NAME", "\"AFS Kapat\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file('afs-release.keystore')
            storePassword 'afskapat'
            keyAlias 'afs'
            keyPassword 'afskapat'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Core modülü (Varsa)
    if (rootProject.findProject(':core') != null) {
        implementation project(':core')
    }

    // Kotlin Standart Kütüphanesi
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'

    // AndroidX & Material UI Kütüphaneleri
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
